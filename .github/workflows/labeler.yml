name: "Pull Request Labeler"
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  labeler:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Labelt op het Conventional Commits-type in de PR-titel, of op de prefix van
      # de branchnaam als de titel geen type heeft. De labels bepalen de rubriek in
      # de release notes (.github/release.yml). Een push verandert de titel niet.
      - if: github.event.action != 'synchronize'
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL_PER_TYPE = {
              feat: "enhancement",
              feature: "enhancement",
              fix: "bug",
              bug: "bug",
              docs: "documentation",
              chore: "chore",
              build: "chore",
              ci: "chore",
              refactor: "chore",
              test: "chore",
              style: "chore",
              perf: "chore",
              // Bekend type zonder label.
              revert: null,
            };
            const BREAKING_CHANGE = "breaking change";

            const { action, changes, pull_request: pr } = context.payload;

            const labelsVoor = (titel) => {
              const kandidaten = [
                // Matcht het type aan het begin van een titel, bv. "feat(api)!: nieuwe endpoint" → "feat"
                /^([a-z]+)(\([^)]*\))?(!)?: /i.exec(titel),

                // Matcht het eerste deel van een branchnaam vóór "/", bv. "feature/login-page" → "feature"
                /^([a-z]+)\//i.exec(pr.head.ref),
              ];
              const match = kandidaten.find(
                (kandidaat) => kandidaat && kandidaat[1].toLowerCase() in LABEL_PER_TYPE,
              );
              if (!match) return [];
              const label = LABEL_PER_TYPE[match[1].toLowerCase()];
              return [label, match[3] && BREAKING_CHANGE].filter(Boolean);
            };

            // Een bewerking van alleen de beschrijving verandert niets aan de labels.
            if (action === "edited" && !changes?.title) return;

            const huidig = pr.labels.map((label) => label.name);
            const gewenst = labelsVoor(pr.title);
            // Verwijder alleen wat de vorige titel opleverde; handmatig gezette labels blijven staan.
            const vorige = changes?.title ? labelsVoor(changes.title.from) : [];
            const vervallen = vorige.filter(
              (label) => !gewenst.includes(label) && huidig.includes(label),
            );
            const nieuw = gewenst.filter((label) => !huidig.includes(label));

            const issue = { ...context.repo, issue_number: pr.number };
            for (const name of vervallen) {
              await github.rest.issues.removeLabel({ ...issue, name });
            }
            if (nieuw.length > 0) {
              await github.rest.issues.addLabels({ ...issue, labels: nieuw });
            }
            core.info(`Titel: ${pr.title} | toegevoegd: ${nieuw} | verwijderd: ${vervallen}`);

      # Zet `impact eindgebruiker` zodra een bestaande test bij gelijke input andere output
      # geeft: dan ziet een gebruiker na upgraden iets anders. Een nieuwe test, of een
      # gewijzigde beschrijving, bron of input in een test, verandert voor gebruikers niets.
      # Het label blijft staan als de wijziging later wegvalt, omdat ook een mens of agent
      # het zet bij impact zonder outputwijziging.
      - if: github.event.action != 'edited'
        uses: actions/github-script@v9
        with:
          script: |
            const IMPACT = "impact eindgebruiker";
            const TESTREFERENTIE = /^tests\/(.+\/)?testreferenties\/[^/]+\.md$/;
            const OUTPUT_JSON = /^tests\/docs\/output_json_[^/]+\.json$/;
            const OUTPUTSECTIES = ["Output", "Rapport", "Waarschuwingen"];

            const pr = context.payload.pull_request;
            if (pr.labels.some((label) => label.name === IMPACT)) return;

            // De lijst gewijzigde bestanden vergelijkt met de merge-base; doe dat hier ook.
            const { data: vergelijking } = await github.rest.repos.compareCommits({
              ...context.repo,
              base: pr.base.sha,
              head: pr.head.sha,
            });
            const mergeBase = vergelijking.merge_base_commit.sha;

            const inhoud = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref,
                mediaType: { format: "raw" },
              });
              return data;
            };
            // Tekst van een sectie `## <naam>` tot de volgende sectie.
            const sectie = (tekst, naam) =>
              tekst.split(/^## /m).find((deel) => deel.startsWith(`${naam}\n`)) ?? "";

            const outputGewijzigd = async (bestand) => {
              if (OUTPUT_JSON.test(bestand.filename)) return true;
              if (!TESTREFERENTIE.test(bestand.filename)) return false;
              const oud = await inhoud(bestand.filename, mergeBase);
              const nieuw = await inhoud(bestand.filename, pr.head.sha);
              if (sectie(oud, "Input") !== sectie(nieuw, "Input")) return false;
              return OUTPUTSECTIES.some((naam) => sectie(oud, naam) !== sectie(nieuw, naam));
            };

            const bestanden = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
            });
            for (const bestand of bestanden) {
              // Alleen bestaande tests: nieuwe, verwijderde en hernoemde tests tellen niet.
              if (bestand.status !== "modified") continue;
              if (!(await outputGewijzigd(bestand))) continue;

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [IMPACT],
              });
              core.info(`Output gewijzigd bij gelijke input: ${bestand.filename}`);
              return;
            }
